[workspace]
resolver = "3"
members = ["lib", "cli", "gui"]
# Plain `cargo build`/`cargo run`/`cargo test` cover only the library and `ph`;
# use `--workspace` or `-p pathhunter-gui` for the GUI.
default-members = ["lib", "cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
